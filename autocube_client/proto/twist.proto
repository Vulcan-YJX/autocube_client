syntax = "proto3";

package autocube;

service TwistService {
  // 双向流
  rpc TwistStream(stream TwistMessage) returns (stream TwistMessage);
}

message TwistMessage {
  double linear_x = 1;
  double linear_y = 2;
  double linear_z = 3;
  double angular_x = 4;
  double angular_y = 5;
  double angular_z = 6;
  string topic_name = 7;
}
